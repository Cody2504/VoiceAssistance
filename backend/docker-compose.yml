x-common-env: &common-env
  DEPLOY_ENV: ${DEPLOY_ENV:-local}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
  SECRET_KEY: ${SECRET_KEY}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-60}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
  POSTGRES_USER: ${POSTGRES_USER:-jockey}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jockey_dev}
  POSTGRES_DB: ${POSTGRES_DB:-jockey}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_HOST: redis
  REDIS_PORT: 6379
  IAM_BASE_URL: http://iam:1100
  VIDEO_SERVICE_BASE_URL: http://video-service:1101
  AGENT_SERVICE_BASE_URL: http://agent-service:1102
  TOKEN_USAGE_BASE_URL: http://token-usage:1103
  BILLING_BASE_URL: http://billing:1104
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLIC_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
  STRIPE_PRICE_DEVELOPER: ${STRIPE_PRICE_DEVELOPER}
  BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:-http://localhost:5173/settings/billing?checkout=success}
  BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:-http://localhost:5173/settings/billing?checkout=cancelled}

services:
  iam:
    build:
      context: ..
      dockerfile: backend/iam/Dockerfile
    container_name: jockey-iam
    environment:
      <<: *common-env
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "1100:1100"
    networks: [jockey-net]

  video-service:
    build:
      context: ..
      dockerfile: backend/video-service/Dockerfile
    container_name: jockey-video
    environment:
      <<: *common-env
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-jockey_shots}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jockey}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jockey_dev_secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      HF_TOKEN: ${HF_TOKEN}
      LIGHTHOUSE_DEVICE: ${LIGHTHOUSE_DEVICE:-cpu}
      PYTHONPATH: /app:/shared
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      qdrant:   { condition: service_healthy }
      minio:    { condition: service_healthy }
    ports:
      - "1101:1101"
    volumes:
      - ./.models:/models
    networks: [jockey-net]

  # video-worker: scalable RQ worker that drains the `video_index` Redis queue.
  # `container_name` is intentionally omitted so docker-compose can run multiple
  # replicas:
  #   docker-compose up -d --scale video-worker=N
  # Each replica is an RQ `Worker` (forking) — the parent process does only
  # BLPOP and never touches CUDA, then forks a fresh work-horse per job that
  # cold-loads ~14 GB of model weights, runs the pipeline, exits. Cost is
  # ~30–60 s of startup per video; gain is fault isolation (a SIGSEGV in one
  # job no longer kills the worker).
  #
  # CUDA MPS lets multiple replicas' work-horses share the GPU at SM
  # granularity instead of time-slicing the whole CUDA context. To enable on
  # the host, BEFORE `docker-compose up`:
  #   sudo nvidia-cuda-mps-control -d
  # (creates pipes in /tmp/nvidia-mps and logs in /tmp/nvidia-log). The mounts
  # and env vars below let containers register as MPS clients. Without the
  # daemon running, the env vars are inert — pipeline still works, just no
  # SM-level sharing.
  #
  # VRAM budget on an RTX 3090 (24 GB): a single work-horse holds ~14 GB; with
  # MPS, you can typically run --scale video-worker=2 comfortably. Pushing to
  # 3 will likely OOM. See CROSS_VIDEO_LECTURE_PLAN.md §8 Phase 1.5 + Phase 2c.
  video-worker:
    build:
      context: ..
      dockerfile: backend/video-service/Dockerfile
    environment:
      <<: *common-env
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-jockey_shots}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jockey}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jockey_dev_secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      HF_TOKEN: ${HF_TOKEN}
      LIGHTHOUSE_DEVICE: ${LIGHTHOUSE_DEVICE:-cpu}
      CUDA_MPS_PIPE_DIRECTORY: /tmp/nvidia-mps
      CUDA_MPS_LOG_DIRECTORY: /tmp/nvidia-log
    command: ["python", "-m", "main.workers.queue_worker"]
    restart: always
    depends_on:
      video-service: { condition: service_started }
      redis:         { condition: service_healthy }
    volumes:
      - ./.models:/models
      - /tmp/nvidia-mps:/tmp/nvidia-mps
      - /tmp/nvidia-log:/tmp/nvidia-log
    networks: [jockey-net]

  agent-service:
    build:
      context: ..
      dockerfile: backend/agent-service/Dockerfile
    container_name: jockey-agent
    environment:
      <<: *common-env
      # video-service runs on the vast pod, not in this compose network — reach it
      # over the public Cloudflare tunnel (JWTs validate via the shared SECRET_KEY).
      VIDEO_SERVICE_BASE_URL: ${VIDEO_SERVICE_BASE_URL:-https://video.voiceassistant.uk}
      LLM_PROVIDER: ${LLM_PROVIDER:-OPENAI}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_PLANNER_MODEL: ${OPENAI_PLANNER_MODEL:-gpt-4o}
      OPENAI_WORKER_MODEL: ${OPENAI_WORKER_MODEL:-gpt-4o-mini}
      # OpenRouter fallback (LLM_PROVIDER=OPENROUTER) — routes router/reflect via
      # OpenRouter billing when the direct OpenAI account is rate-limited.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      OPENAI_API_VERSION: ${OPENAI_API_VERSION:-2024-08-01-preview}
      AZURE_PLANNER_DEPLOYMENT: ${AZURE_PLANNER_DEPLOYMENT:-gpt-4o}
      AZURE_WORKER_DEPLOYMENT: ${AZURE_WORKER_DEPLOYMENT:-gpt-4o-mini}
      STIRRUP_SEARCH: ${STIRRUP_SEARCH:-local}
      STIRRUP_TEXTGEN: ${STIRRUP_TEXTGEN:-local}
      TWELVE_LABS_API_KEY: ${TWELVE_LABS_API_KEY}
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports:
      - "1102:1102"
    networks: [jockey-net]

  token-usage:
    build:
      context: ..
      dockerfile: backend/token-usage/Dockerfile
    container_name: jockey-token-usage
    environment:
      <<: *common-env
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "1103:1103"
    networks: [jockey-net]

  billing:
    build:
      context: ..
      dockerfile: backend/billing/Dockerfile
    container_name: jockey-billing
    environment:
      <<: *common-env
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "1104:1104"
    networks: [jockey-net]

  gateway:
    build: ./gateway
    container_name: jockey-gateway
    restart: always
    # video-service deliberately not listed: it runs on the vast GPU pod and
    # is reached via the Cloudflare-pinned `video.voiceassistant.uk` upstream
    # (see extra_hosts below + gateway nginx template VIDEO_UPSTREAM).
    depends_on: [iam, agent-service, token-usage, billing]
    ports:
      - "${GATEWAY_PORT:-8085}:80"
    # `video.voiceassistant.uk` is pinned to a Cloudflare anycast IP to dodge
    # intermittent SERVFAIL from Docker's embedded DNS forwarding through
    # WSL2's host resolver (migration log 2026-05-23 problem 9). If the IP
    # ever changes, `dig video.voiceassistant.uk @1.1.1.1` for a fresh one.
    extra_hosts:
      - "video.voiceassistant.uk:172.67.133.180"
    networks: [jockey-net]

  # ---- Infra (from database/docker-compose.yml, redeclared for one-shot startup) ----
  # Postgres/Redis are published on non-default host ports (15432/16379) so that
  #   (a) agent-service can reach them over host networking, AND
  #   (b) the co-located Fsoft work-platform stack (which holds 5432/6379 on the host)
  #       continues to work side-by-side.
  # Qdrant is not published — agent-service doesn't need it; video-service reaches
  # it via container DNS on jockey-net.
  postgres:
    image: postgres:16.8-bullseye
    container_name: jockey-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jockey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jockey_dev}
      POSTGRES_DB: ${POSTGRES_DB:-jockey}
    restart: always
    ports: ["15432:5432"]
    volumes: ["jockey_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jockey} -d ${POSTGRES_DB:-jockey}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [jockey-net]

  redis:
    image: redis:7.4.3
    container_name: jockey-redis
    restart: always
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [jockey-net]

  qdrant:
    image: qdrant/qdrant:v1.14.0
    container_name: jockey-qdrant
    ports: ["16333:6333"]
    volumes: ["jockey_qdrant:/qdrant/storage"]
    restart: always
    healthcheck:
      # qdrant image ships with bash; use /dev/tcp probe since it ships without curl/wget.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [jockey-net]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: jockey-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jockey}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jockey_dev_secret}
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes: ["jockey_minio:/data"]
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [jockey-net]

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: jockey-minio-init
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-jockey} ${MINIO_ROOT_PASSWORD:-jockey_dev_secret};
      /usr/bin/mc mb --ignore-existing local/videos;
      /usr/bin/mc mb --ignore-existing local/edits;
      /usr/bin/mc mb --ignore-existing local/thumbs;
      exit 0;
      "
    networks: [jockey-net]

networks:
  jockey-net:
    name: jockey-net
    driver: bridge

volumes:
  jockey_pgdata:
  jockey_qdrant:
  jockey_minio:
