- id: disambig-stale-video-scope
  query: summarize this video
  context:
    video_id: vid-NEW-attached
  expected_tools:
  - name: ask_video_local
    args:
      video_id: vid-NEW-attached
      question: ~summarize
  fake_outputs:
    ask_video_local:
      video_id: vid-NEW-attached
      answer: This video shows a basketball game.
      citations:
      - t_start: 10.0
        t_end: 14.0
      modality: video
  reference_answer: This video shows a basketball game.
