- id: disambig-when-not-search
  query: when do they score in this game?
  context:
    video_id: vid-soccer-1
  expected_tools:
  - name: ground_video
    args:
      video_id: vid-soccer-1
      query: ~score
  fake_outputs:
    ground_video:
      video_id: vid-soccer-1
      moments:
      - t_start: 41.0
        t_end: 47.0
        label: score
        score: 0.9
        source: grounding
- id: disambig-relations-not-mentions
