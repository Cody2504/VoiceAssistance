# ViCLIP Fine-Tuning Configuration
# Reference config — used by finetune_viclip.py

model:
  name: "OpenGVLab/ViCLIP-L-14"
  device: "cuda"
  embedding_dim: 768

lora:
  enabled: true
  rank: 16
  alpha: 32
  target_modules: ["q_proj", "v_proj", "k_proj"]
  dropout: 0.05

data:
  datasets:
    - name: "qv_highlights"
      priority: "HIGH"
      weight: 2.0
      description: "Query→timestamp pairs for retrieval"

    - name: "activitynet"
      priority: "HIGH"
      weight: 1.0
      description: "Dense video captions"

    - name: "youcook2"
      priority: "MEDIUM"
      weight: 0.5
      description: "Instructional video captions"

    - name: "charades_sta"
      priority: "MEDIUM"
      weight: 0.5
      description: "Temporal grounding"

  max_frames: 8
  frame_sample_mode: "uniform_last_frame"

training:
  batch_size: 32
  learning_rate: 1.0e-4
  epochs: 10
  warmup_ratio: 0.1
  loss: "InfoNCE"
  temperature: 0.07
  optimizer: "AdamW"
  weight_decay: 0.01
  fp16: true
  gradient_checkpointing: true
  save_every: 2

hardware:
  min_gpus: 1
  recommended: "1x A100 40GB for LoRA, 2-4x A100 for full fine-tuning"
